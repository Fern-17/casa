const DATA={"title": "Conversa do WhatsApp com Alberto Casa", "messages": [{"date": "18/12/2025", "time": "08:27", "timestamp": "2025-12-18T08:27:00", "sender": "Sistema", "text": "As mensagens e ligações são protegidas com a criptografia de ponta a ponta. Somente as pessoas que fazem parte da conversa podem ler, ouvir e compartilhar esse conteúdo. *Saiba mais*", "media": [], "id": "MSG_D2D48DBEB72B52F5", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "08:27", "timestamp": "2025-12-18T08:27:00", "sender": "Fernando", "text": "Bom dia. Sou o Fernando. Da casa de Timon, do Paulo.", "media": [], "id": "MSG_6BDABA49F31D5E70", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "08:27", "timestamp": "2025-12-18T08:27:00", "sender": "Fernando", "text": "Tudo bem?", "media": [], "id": "MSG_7680B3DBB2365DDA", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "08:28", "timestamp": "2025-12-18T08:28:00", "sender": "Alberto Casa", "text": "Mensagem apagada", "media": [], "id": "MSG_8F2B677AAEE25F3A", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "08:28", "timestamp": "2025-12-18T08:28:00", "sender": "Alberto Casa", "text": "Bom dia", "media": [], "id": "MSG_BCA105DCB9B85DD6", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "08:28", "timestamp": "2025-12-18T08:28:00", "sender": "Alberto Casa", "text": "Tudo bem", "media": [], "id": "MSG_A33BAF002DFE5929", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "08:28", "timestamp": "2025-12-18T08:28:00", "sender": "Alberto Casa", "text": "‎PTT-20251218-WA0002.opus (arquivo anexado)", "media": [{"id": "MED_FC73732093B85138", "name": "PTT-20251218-WA0002.opus", "path": "media/MED_FC73732093B85138_PTT-20251218-WA0002.opus", "type": ".opus", "bytes": 52789, "sha256": "8d5c831c531d52dcf0499d1754b27cc1583b3dc87f348f9638adca98c1b3220b", "transcript": "Bom dia, tudo bem? Rapaz, eu queria até que tu tivesse como tu deixar a chave com alguém bem aí da obra. Aí tu só me fala o nome. É porque eu não me lembrava que tinha uma consulta do neném agora pela manhã. Aí eu tô bem que né, na Vagina Rosa Marra tô saindo, tô descendo pra aí, viu? Aí tu pode deixar aí, tu só me diz o nome, quando chegar aí eu pego. Então convidei a sua gente, é por aí.", "language": "pt"}], "id": "MSG_497D8E50A9315FD8", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "08:29", "timestamp": "2025-12-18T08:29:00", "sender": "Alberto Casa", "text": "‎PTT-20251218-WA0003.opus (arquivo anexado)", "media": [{"id": "MED_40490F370C78569A", "name": "PTT-20251218-WA0003.opus", "path": "media/MED_40490F370C78569A_PTT-20251218-WA0003.opus", "type": ".opus", "bytes": 20632, "sha256": "67e81654f8f808424ad791d6e7b89d41de68ed626120580390758202963334e1", "transcript": "Eu já falei com o Pedro, eu deixei um aí para ele, quando eu chegar eu botei ele para casa, mas esses acabamentos estão faltando, aí o pintor vai para finalizar.", "language": "pt"}], "id": "MSG_AB74E58A342955DF", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "08:31", "timestamp": "2025-12-18T08:31:00", "sender": "Fernando", "text": "‎PTT-20251218-WA0004.opus (arquivo anexado)", "media": [{"id": "MED_1F25B090ECBA53D3", "name": "PTT-20251218-WA0004.opus", "path": "media/MED_1F25B090ECBA53D3_PTT-20251218-WA0004.opus", "type": ".opus", "bytes": 31345, "sha256": "4fd58de3e8b03c8e5c01e782bddad6a408b4525e20c5a9d4442cb7c260c8fb82", "transcript": "Bom dia, chefe. Eu já deixei a casa fechada e entreguei a chave para o vigia, certo? Aí depois eu vou te falar se você está no hospital. Quando chegar e me dar um toque, eu te falo algumas outras coisas, certo? Mas relaxa.", "language": "pt"}], "id": "MSG_59199FC8D8EB58DC", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "08:31", "timestamp": "2025-12-18T08:31:00", "sender": "Fernando", "text": "‎PTT-20251218-WA0005.opus (arquivo anexado)", "media": [{"id": "MED_3830DC4234A75413", "name": "PTT-20251218-WA0005.opus", "path": "media/MED_3830DC4234A75413_PTT-20251218-WA0005.opus", "type": ".opus", "bytes": 19681, "sha256": "2ec0bf9524383eef02b58b1fbad8feeadc8183860205b313ced6e93f7adb7ecc", "transcript": "Chego lá e te falo, é porque o rapaz da elétrica esqueceu de colocar as telhas Aí ficou um buraco lá e choveu ontem Mas quando chegar eu te mostro", "language": "pt"}], "id": "MSG_E65166ED535455A6", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "08:33", "timestamp": "2025-12-18T08:33:00", "sender": "Alberto Casa", "text": "‎PTT-20251218-WA0006.opus (arquivo anexado)", "media": [{"id": "MED_0F83DE3B4B6B5A80", "name": "PTT-20251218-WA0006.opus", "path": "media/MED_0F83DE3B4B6B5A80_PTT-20251218-WA0006.opus", "type": ".opus", "bytes": 60299, "sha256": "f872a8f64d8af066e5eb7f9db2715c65238da50e36718f70eb31eca4f6ff82d2", "transcript": "Beleza, rapaz, foi até eu mesmo que coisei aí na hora do rapaz da máquina, só eu destelhei, que eu fui ligar o neutro, né, tá desligado em cima, e eu fiquei naquela dúvida se tinha fechado ou não. Mas aí, se tiver coisado aí, a gente já, o pintor, manda o pintor conferir logo, já ajeitar tudo aí, viu? Vai ficar no jeito, vai ficar despreocupado, a gente dá o grau aí no fogo, se tiver molhado.", "language": "pt"}], "id": "MSG_B6CAEC30061B5998", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "08:36", "timestamp": "2025-12-18T08:36:00", "sender": "Fernando", "text": "Ok", "media": [], "id": "MSG_1C5ED43AFB225FA5", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "16:03", "timestamp": "2025-12-18T16:03:00", "sender": "Fernando", "text": "Boa tarde.", "media": [], "id": "MSG_D2AEF65957C45AFA", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "16:03", "timestamp": "2025-12-18T16:03:00", "sender": "Fernando", "text": "Deu certo a questão do teto?", "media": [], "id": "MSG_1BE3FB2D4E5A5D29", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "16:07", "timestamp": "2025-12-18T16:07:00", "sender": "Fernando", "text": "Eu gostaria de ver algumas contigo.\\nEu vi que tá faltando um dos ralos no tanque e ver se dá pra jogar uma luz lá na área de lavar roupa.", "media": [], "id": "MSG_1E85788956A65D98", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "16:08", "timestamp": "2025-12-18T16:08:00", "sender": "Fernando", "text": "Depois você poderia me dizer por quanto sairia pra fechar o quintal conforme a gente havia conversado?", "media": [], "id": "MSG_967CD77B7D6D5712", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "16:36", "timestamp": "2025-12-18T16:36:00", "sender": "Alberto Casa", "text": "‎PTT-20251218-WA0012.opus (arquivo anexado)", "media": [{"id": "MED_5D8FA00CCEC55B7E", "name": "PTT-20251218-WA0012.opus", "path": "media/MED_5D8FA00CCEC55B7E_PTT-20251218-WA0012.opus", "type": ".opus", "bytes": 99415, "sha256": "a6f8d314e9a980c4af966e2f6e024e124a86a2c9aa0971946af33fe4d58050d8", "transcript": "Ah, pô, beleza. Eu botei lá o da pia lá, que eu tava falando, viu? A válvula zinada da pia. Aí liguei a luminária do corredor. Aí liguei lá o refletor, a luminária da frente. Estão ligando juntos os dois, mas aí é porque não tinha um interruptor de três teclas pra botar uma tecla só pra cada um. Aí, o tela onde tava lá aberto foi coberto. Aí o pintor só não pintou porque ainda tava meio molhado, ia esperar secar. Aí ele vai fazer um reparozinho lá, o pintor. Ele chegou meio tarde. As meninas tamparam os buracos lá. Aí tamparam lá as outras laterais, deixaram o pão do pintor já, viu? Aí o cantor falou que não pintou pra isso, amanhã ele vai pra finalizar.", "language": "pt"}], "id": "MSG_B6C4CA11D654506A", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "16:36", "timestamp": "2025-12-18T16:36:00", "sender": "Alberto Casa", "text": "‎PTT-20251218-WA0013.opus (arquivo anexado)", "media": [{"id": "MED_7C5A9C2FE5A25A2F", "name": "PTT-20251218-WA0013.opus", "path": "media/MED_7C5A9C2FE5A25A2F_PTT-20251218-WA0013.opus", "type": ".opus", "bytes": 12357, "sha256": "8d712528a21268012c7650f45a2ef0d741bc079624086fb23c44130a571b94a5", "transcript": "Eu deixei a chave com vigia, viu? Ele foi só jantar, mas ele desceu ligeiro de janta e volta.", "language": "pt"}], "id": "MSG_294AACEF0F2759F5", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "16:38", "timestamp": "2025-12-18T16:38:00", "sender": "Fernando", "text": "‎PTT-20251218-WA0014.opus (arquivo anexado)", "media": [{"id": "MED_FADE76FA20E95E9C", "name": "PTT-20251218-WA0014.opus", "path": "media/MED_FADE76FA20E95E9C_PTT-20251218-WA0014.opus", "type": ".opus", "bytes": 36672, "sha256": "1c4517ff8dd1fcb191083e5e3b09fe4bf79a9dd82eaf0521850e100c365bfde8", "transcript": "beleza chefe a questão lado da lâmpada na luminária botar uma luz lá no na lavanderia na parte de lavar roupa tem jeito e depois de ver o preço lado de fechar o fundo o que pegaria quando sair para fazer esse serviço", "language": "pt"}], "id": "MSG_2BC8248453345E86", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "16:39", "timestamp": "2025-12-18T16:39:00", "sender": "Alberto Casa", "text": "‎PTT-20251218-WA0015.opus (arquivo anexado)", "media": [{"id": "MED_0ED857E4CFC15A2F", "name": "PTT-20251218-WA0015.opus", "path": "media/MED_0ED857E4CFC15A2F_PTT-20251218-WA0015.opus", "type": ".opus", "bytes": 37365, "sha256": "db1be48bdcc2b9ad2d0e7cc3369f6e5546455408074c203a9fa4f9b9a4116243", "transcript": "Pronto, amanhã eu já puxo lá pro fundo, viu? Que a do fundo deve ficar junto com a da lateral, pra acender as duas. Do fundo é da lateral, que vai ter que botar ela bem naquela linha da lateral.", "language": "pt"}], "id": "MSG_00002FE2BD6B5D49", "unresolved_media": 0, "missing_files": []}, {"date": "18/12/2025", "time": "16:52", "timestamp": "2025-12-18T16:52:00", "sender": "Fernando", "text": "Tá ok", "media": [], "id": "MSG_EDAC5105D0BB570F", "unresolved_media": 0, "missing_files": []}, {"date": "19/12/2025", "time": "15:32", "timestamp": "2025-12-19T15:32:00", "sender": "Fernando", "text": "‎PTT-20251219-WA0002.opus (arquivo anexado)", "media": [{"id": "MED_539DDCCE38705B28", "name": "PTT-20251219-WA0002.opus", "path": "media/MED_539DDCCE38705B28_PTT-20251219-WA0002.opus", "type": ".opus", "bytes": 48997, "sha256": "f89474f3ca6ca77098aeafdfe779d1aaa9decb6711d3548d7731279d66c7bfa6", "transcript": "Boa tarde chefe, tu pegou a chave com vigia hoje, pra fazer aquele resto que faltava lá Aí surgiu uma dúvida, essa cerca tá funcionando? Como é que ela funciona? Porque a gente seguiu os fios lá e parecia que não tá funcionando não Pode me dar uma orientação em uma luz, ver se tá funcionando direitinho?", "language": "pt"}], "id": "MSG_5DA079400CD55C4A", "unresolved_media": 0, "missing_files": []}, {"date": "19/12/2025", "time": "16:03", "timestamp": "2025-12-19T16:03:00", "sender": "Alberto Casa", "text": "‎PTT-20251219-WA0005.opus (arquivo anexado)", "media": [{"id": "MED_7ACE69F8EF2D510F", "name": "PTT-20251219-WA0005.opus", "path": "media/MED_7ACE69F8EF2D510F_PTT-20251219-WA0005.opus", "type": ".opus", "bytes": 59900, "sha256": "ee74acef499803bb17ff0778cccaaa7fab113f958794addfab0cca83363c1459", "transcript": "O rapaz da cerca tá lá, passei agorinha lá, tava lá com ele lá, ele tá só puxando os cabeamento lá pra deixar ligado lá, funcionando na central, viu? Aí se não der tempo hoje que ele tá fixando a... como é que se chama? Chubando as outras barras do outro lado, é aí que ele vem pra ir, mas ele tá aí, tava agorinha com ele lá, até mostrei pra ele como é que a gente teria que fazer.", "language": "pt"}], "id": "MSG_B69D7031AE0A50AE", "unresolved_media": 0, "missing_files": []}, {"date": "19/12/2025", "time": "16:27", "timestamp": "2025-12-19T16:27:00", "sender": "Fernando", "text": "Blz", "media": [], "id": "MSG_A888C779450D5C84", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "09:16", "timestamp": "2026-01-06T09:16:00", "sender": "Fernando", "text": "Bom dia, Alberto. Tudo bom com você?", "media": [], "id": "MSG_C4F7AB7513725134", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "09:17", "timestamp": "2026-01-06T09:17:00", "sender": "Fernando", "text": "Que dia da certo pra fazer o ajuste e ligar a cerca? Tem como nesse dia puxar um ponto de luz lá no quintal?", "media": [], "id": "MSG_56ABCFEDD8E954C2", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "09:18", "timestamp": "2026-01-06T09:18:00", "sender": "Alberto Casa", "text": "‎PTT-20260106-WA0008.opus (arquivo anexado)", "media": [{"id": "MED_ECB61BDC39CC5608", "name": "PTT-20260106-WA0008.opus", "path": "media/MED_ECB61BDC39CC5608_PTT-20260106-WA0008.opus", "type": ".opus", "bytes": 37182, "sha256": "cbe1b8f46abf22934f1ce212dc2e92871a3b01908e94dd95d6e74b7a936c7469", "transcript": "Eu vou lá para me puxar, viu? Deixou a chave no caça, deixou lá com o vigia, né? Pois pronto. Só para ter a minha cuidado mais cedo um pouquinho. Mas eu vou, porque eu vim aqui em 13 de março, vou ver se eu volto lá e resolvo essa coisa lá com ele.", "language": "pt"}], "id": "MSG_A2EF54DE33485C0F", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "09:18", "timestamp": "2026-01-06T09:18:00", "sender": "Fernando", "text": "Não deixei, nao", "media": [], "id": "MSG_6576C9F1FFEE563A", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "09:18", "timestamp": "2026-01-06T09:18:00", "sender": "Fernando", "text": "Queria era marcar um dia com você pra eu deixar", "media": [], "id": "MSG_A02C1FC68CC156C8", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "09:19", "timestamp": "2026-01-06T09:19:00", "sender": "Fernando", "text": "Que aí eu te mostrava outras coisas.", "media": [], "id": "MSG_1EE79B92461A5F12", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "09:19", "timestamp": "2026-01-06T09:19:00", "sender": "Fernando", "text": "<Mídia oculta>", "media": [], "id": "MSG_BD376EDDB6FC5310", "unresolved_media": 1, "missing_files": []}, {"date": "06/01/2026", "time": "09:20", "timestamp": "2026-01-06T09:20:00", "sender": "Fernando", "text": "O \"castelo\" do registro deve ou estar enganchando ou quebrado. A torneira não tem vasão. Mesmo abrindo toda.", "media": [], "id": "MSG_2A26AD7264A65017", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "09:37", "timestamp": "2026-01-06T09:37:00", "sender": "Alberto Casa", "text": "‎PTT-20260106-WA0010.opus (arquivo anexado)", "media": [{"id": "MED_A68BAAF6540D5678", "name": "PTT-20260106-WA0010.opus", "path": "media/MED_A68BAAF6540D5678_PTT-20260106-WA0010.opus", "type": ".opus", "bytes": 53330, "sha256": "ddc4c76248a408bb43a13d1316b302177805df65f8024d670bb7ee5bedb9cec5", "transcript": "Beleza, foi beleza. De um dia aí vão pra ti. Que aí eu vou lá e nós finaliza logo tudo. Aí tu vê bem esse resisto de fora pra ver se ele tá desligado da caixa d'água. E se ele tiver desligado, aí ele... A caixa deve tá secando e ele tá sem pressão, entendeu? Bem na... Tu abre a porta da cozinha, tem um resistozinho.", "language": "pt"}], "id": "MSG_C5AFC28184DC585D", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "09:39", "timestamp": "2026-01-06T09:39:00", "sender": "Fernando", "text": "‎PTT-20260106-WA0011.opus (arquivo anexado)", "media": [{"id": "MED_696257B5E1925815", "name": "PTT-20260106-WA0011.opus", "path": "media/MED_696257B5E1925815_PTT-20260106-WA0011.opus", "type": ".opus", "bytes": 35511, "sha256": "38ea5c65554a34e8c71c49085d88f6d7bd6476ba6954cd79e214a0ddcfdb8909", "transcript": "Eu já desliguei, pode ser amanhã. Amanhã ou então de tarde, vamos dizer, se é de tarde ou de manhã que eu falo com o chefe aqui pra liberar, beleza? Pode ser amanhã ou então quinta-feira, tu diz qual que é melhor. Beleza? Mas já testei já tudo já, os outros estão tudo de boa, forte, só ele que não tá indo.", "language": "pt"}], "id": "MSG_7672CB0B55FD5BC5", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "14:56", "timestamp": "2026-01-06T14:56:00", "sender": "Fernando", "text": "Boa tarde. Da certo amanhã?", "media": [], "id": "MSG_5960490112405035", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "17:21", "timestamp": "2026-01-06T17:21:00", "sender": "Alberto Casa", "text": "‎PTT-20260106-WA0018.opus (arquivo anexado)", "media": [{"id": "MED_660C6C5A59495225", "name": "PTT-20260106-WA0018.opus", "path": "media/MED_660C6C5A59495225_PTT-20260106-WA0018.opus", "type": ".opus", "bytes": 28766, "sha256": "16d3ff8e865efb114d6c0786affa2a9acaad93157a14fe30cb718dd09c0ee360", "transcript": "É porque como essa estandeira tem uma peneirazinha, aí deve ser só o cor da peneira, mas vou passar. Pode ser amanhã, tu me liga de manhã, antes de tu sair que eu passei pra dar uma olhada aí, viu?", "language": "pt"}], "id": "MSG_859FD2BE8D2350D9", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "17:21", "timestamp": "2026-01-06T17:21:00", "sender": "Alberto Casa", "text": "‎PTT-20260106-WA0019.opus (arquivo anexado)", "media": [{"id": "MED_55317B7D3C8154B5", "name": "PTT-20260106-WA0019.opus", "path": "media/MED_55317B7D3C8154B5_PTT-20260106-WA0019.opus", "type": ".opus", "bytes": 13594, "sha256": "8ef6c35f37dcd000b1ba4638900a2948d628cfc7cf20a22a63cbd9aff85dfec5", "transcript": "A pessoa está em cima hoje, em cima do teto fazendo as instalações, deixei o celular embaixo.", "language": "pt"}], "id": "MSG_6FFD3586159E5BF9", "unresolved_media": 0, "missing_files": []}, {"date": "06/01/2026", "time": "17:22", "timestamp": "2026-01-06T17:22:00", "sender": "Fernando", "text": "Eu testei tirando a peneira. Desmontei a torneira.\\n\\nMas amanhã te aviso antes de eu sair", "media": [], "id": "MSG_04DADC397A81581E", "unresolved_media": 0, "missing_files": []}, {"date": "07/01/2026", "time": "07:44", "timestamp": "2026-01-07T07:44:00", "sender": "Fernando", "text": "Bom dia. O cara da cerca vem hoje?", "media": [], "id": "MSG_AA3E81BA12A9567D", "unresolved_media": 0, "missing_files": []}, {"date": "07/01/2026", "time": "07:44", "timestamp": "2026-01-07T07:44:00", "sender": "Fernando", "text": "Se ele vier me avisa que peço um tempo no serviço e venho pra casa", "media": [], "id": "MSG_7A2FDB5E18445CE8", "unresolved_media": 0, "missing_files": []}, {"date": "07/01/2026", "time": "07:54", "timestamp": "2026-01-07T07:54:00", "sender": "Alberto Casa", "text": "‎PTT-20260107-WA0000.opus (arquivo anexado)", "media": [{"id": "MED_C67E3611607B5797", "name": "PTT-20260107-WA0000.opus", "path": "media/MED_C67E3611607B5797_PTT-20260107-WA0000.opus", "type": ".opus", "bytes": 9649, "sha256": "f1f1a8860c829812df359ae04f0d74e2fefc61985b51e1966b2ccfa5db0709b3", "transcript": "Pronto, beleza, eu tô só ligando aqui pra ele aqui pra confirmar o que ele também saiu agora.", "language": "pt"}], "id": "MSG_D89216885B125FB0", "unresolved_media": 0, "missing_files": []}, {"date": "07/01/2026", "time": "08:04", "timestamp": "2026-01-07T08:04:00", "sender": "Fernando", "text": "Ok. Ele confirmando me fala que pulo pra ai", "media": [], "id": "MSG_C8185DB538F552DD", "unresolved_media": 0, "missing_files": []}, {"date": "08/01/2026", "time": "14:09", "timestamp": "2026-01-08T14:09:00", "sender": "Fernando", "text": "Boa tarde. Paulino disse que o cara da cerca iria lá hoje. Sabe me informar se ele vai?", "media": [], "id": "MSG_07E9FFDD07E45F5F", "unresolved_media": 0, "missing_files": []}, {"date": "08/01/2026", "time": "14:09", "timestamp": "2026-01-08T14:09:00", "sender": "Fernando", "text": "Preciso saber pra ir pra la", "media": [], "id": "MSG_B48E6177FC0C595B", "unresolved_media": 0, "missing_files": []}, {"date": "08/01/2026", "time": "14:09", "timestamp": "2026-01-08T14:09:00", "sender": "Fernando", "text": "Ele disse que ele iria hoje a tarde.", "media": [], "id": "MSG_E7AE73D1DB105333", "unresolved_media": 0, "missing_files": []}, {"date": "08/01/2026", "time": "14:11", "timestamp": "2026-01-08T14:11:00", "sender": "Alberto Casa", "text": "‎PTT-20260108-WA0011.opus (arquivo anexado)", "media": [{"id": "MED_0A09431FB3805321", "name": "PTT-20260108-WA0011.opus", "path": "media/MED_0A09431FB3805321_PTT-20260108-WA0011.opus", "type": ".opus", "bytes": 56890, "sha256": "034de1ad9507ea0250c47177216a68f52f1c7039132e4167c3cba1dbbab82cb5", "transcript": "Eu deixei até o vigia lá, pro vigia me avisar, né? Que ele chegasse lá, né? Eu tinha falado com o Paulinho que ia hoje, rapaz, mas até hoje já tínhamos falado até com outro cara aqui. Que promete, promete, eu vou hoje, vou amanhã. Tem aquelas duas casas, tem a outra aqui, da outra rua de trás pra ligar. A gente fica esperando, né? Se ele não for hoje, eu vou matar o cara. Amanhã, nós resolvemos isso aí tudo.", "language": "pt"}], "id": "MSG_E0941336F0FE5D3F", "unresolved_media": 0, "missing_files": []}, {"date": "08/01/2026", "time": "14:12", "timestamp": "2026-01-08T14:12:00", "sender": "Fernando", "text": "Blz", "media": [], "id": "MSG_8D0727FD66405837", "unresolved_media": 0, "missing_files": []}, {"date": "12/01/2026", "time": "09:53", "timestamp": "2026-01-12T09:53:00", "sender": "Fernando", "text": "Bom dia. Alberto como tá teu tempo pra dar uma passada lá em casa? Tenho que te mostrar algumas coisas lá.", "media": [], "id": "MSG_1FF4AC20F5D95BC4", "unresolved_media": 0, "missing_files": []}, {"date": "12/01/2026", "time": "14:54", "timestamp": "2026-01-12T14:54:00", "sender": "Fernando", "text": "Boa tarde. Algum retorno?", "media": [], "id": "MSG_2093B9C2CDE453AA", "unresolved_media": 0, "missing_files": []}, {"date": "13/01/2026", "time": "10:24", "timestamp": "2026-01-13T10:24:00", "sender": "Fernando", "text": "Bom dia", "media": [], "id": "MSG_680CF4AF53F0539A", "unresolved_media": 0, "missing_files": []}, {"date": "13/01/2026", "time": "11:44", "timestamp": "2026-01-13T11:44:00", "sender": "Alberto Casa", "text": "‎PTT-20260113-WA0005.opus (arquivo anexado)", "media": [{"id": "MED_EA9F34DD1CB8501A", "name": "PTT-20260113-WA0005.opus", "path": "media/MED_EA9F34DD1CB8501A_PTT-20260113-WA0005.opus", "type": ".opus", "bytes": 58762, "sha256": "fd357b2730bebd77359d731b47250d0748b934b6e141bb89d7fb8885a60471da", "transcript": "Bom dia, meu amigo. Rapaz, eu fui ver a mensagem e esqueci de responder. Quando cheguei lá, estava sem internet. Já passou o dia sem internet. Aí hoje eu fui lá, o aleijado não estava lá, o vigia. O menino está atrás dele lá. O vizinho lá está com a pala da cerca também, para a gente agilizar lá. E o vigia não está lá. Estou tentando falar com ele aqui. Acho que ele deve ter ido almoçar.", "language": "pt"}], "id": "MSG_08623FD2084B5280", "unresolved_media": 0, "missing_files": []}, {"date": "13/01/2026", "time": "11:52", "timestamp": "2026-01-13T11:52:00", "sender": "Fernando", "text": "‎PTT-20260113-WA0006.opus (arquivo anexado)", "media": [{"id": "MED_3BC45AAFEFE754A0", "name": "PTT-20260113-WA0006.opus", "path": "media/MED_3BC45AAFEFE754A0_PTT-20260113-WA0006.opus", "type": ".opus", "bytes": 23820, "sha256": "3d99e91ac85c6192bb3d26ace2a930b83423935c93fd337f6f3f2caa0a3ab2fe", "transcript": "Pois se ele aparecer Me dá um toque aí pra eu descer pra aí, tá bom? Ele avisando que o cara tá aí Só me avisar que eu desço pra aí Ok? Valeu", "language": "pt"}], "id": "MSG_58DA66C79D345E3E", "unresolved_media": 0, "missing_files": []}, {"date": "19/01/2026", "time": "10:17", "timestamp": "2026-01-19T10:17:00", "sender": "Fernando", "text": "Bom dia, Alberto. Tudo bom?\\nQue dia da pra gente ver as coisas que estão pendentes?\\n* Cerca elétrica\\n* O castelo da pia da cozinha\\n* Tá vazando água pelo ladrão do banheiro de visitas. \\n* A luz na área de serviço (tanque)\\n* Pintura do forro da sala, agora já t até rachando \\n* Rachaduras no forro\\nQue dia da pra você dar uma passada lá pra eu te mostrar?", "media": [], "id": "MSG_B4293B4906EE5573", "unresolved_media": 0, "missing_files": []}, {"date": "19/01/2026", "time": "10:26", "timestamp": "2026-01-19T10:26:00", "sender": "Alberto Casa", "text": "‎PTT-20260119-WA0001.opus (arquivo anexado)", "media": [{"id": "MED_A14EB66EED835DD5", "name": "PTT-20260119-WA0001.opus", "path": "media/MED_A14EB66EED835DD5_PTT-20260119-WA0001.opus", "type": ".opus", "bytes": 37359, "sha256": "99b8ef90d9bb46530dfd0519412069be0a1fb23f23aba0aa301f2b775f7f4f0d", "transcript": "Vamos se programar para amanhã, dar certo para amanhã de manhã. É porque agora que eu consegui um rapaz para finalizar nossa encerca aqui. Ele me mandou o áudio aqui que é para me providenciar que amanhã ele vem.", "language": "pt"}], "id": "MSG_C46A1A930C0A5532", "unresolved_media": 0, "missing_files": []}, {"date": "19/01/2026", "time": "10:27", "timestamp": "2026-01-19T10:27:00", "sender": "Alberto Casa", "text": "‎PTT-20260119-WA0002.opus (arquivo anexado)", "media": [{"id": "MED_67A2502AB4B6509A", "name": "PTT-20260119-WA0002.opus", "path": "media/MED_67A2502AB4B6509A_PTT-20260119-WA0002.opus", "type": ".opus", "bytes": 40266, "sha256": "dbaa68e6c1b15e1957b62cf1930c0d05c42da390d567cd4252fbe9d764f79cbd", "transcript": "Bom, pode a gente ver isso daí também, viu? Essa questão da achadura, porque passou muito tempo fechada, ela trinca mesmo, fica aquela pressão lá de casa. Aí eu já levo o pintor pra já tirar essas trincazinhas. Como o pintor tá aí, amanhã eu já mostro pra ele, pra ele fazer isso aí.", "language": "pt"}], "id": "MSG_DA8E7D88A6EB5612", "unresolved_media": 0, "missing_files": []}, {"date": "19/01/2026", "time": "10:28", "timestamp": "2026-01-19T10:28:00", "sender": "Alberto Casa", "text": "‎AUD-20260119-WA0003.opus (arquivo anexado)", "media": [{"id": "MED_D335AA23246F5455", "name": "AUD-20260119-WA0003.opus", "path": "media/MED_D335AA23246F5455_AUD-20260119-WA0003.opus", "type": ".opus", "bytes": 29809, "sha256": "37a8da007d59134bbfc433e948d9bce1d48474d2787061a32954372eb71a75f5", "transcript": "Beleza, deixa eu ir para lá Bota o material lá todinho que eu vou arrumar um tempinho para ir lá Para deixar o serviço do lado Deixa o material todo no ponto que a gente chega lá e já mete marcha", "language": "pt"}], "id": "MSG_831502A86315569E", "unresolved_media": 0, "missing_files": []}, {"date": "19/01/2026", "time": "10:29", "timestamp": "2026-01-19T10:29:00", "sender": "Fernando", "text": "Da sim.", "media": [], "id": "MSG_2A4A4F8368385CC1", "unresolved_media": 0, "missing_files": []}, {"date": "20/01/2026", "time": "08:03", "timestamp": "2026-01-20T08:03:00", "sender": "Fernando", "text": "Bom dia.  Estou em casa hoje pela manha", "media": [], "id": "MSG_AD66E396D1AF5084", "unresolved_media": 0, "missing_files": []}, {"date": "20/01/2026", "time": "08:52", "timestamp": "2026-01-20T08:52:00", "sender": "Fernando", "text": "Alberto. Quem vem hoje pela manhã é o cara da cerca? Tem outras coisas pra fazer, o banheiro vazando, a luz do fundo...", "media": [], "id": "MSG_C2B2D2AAB73C5125", "unresolved_media": 0, "missing_files": []}, {"date": "20/01/2026", "time": "08:55", "timestamp": "2026-01-20T08:55:00", "sender": "Alberto Casa", "text": "‎PTT-20260120-WA0002.opus (arquivo anexado)", "media": [{"id": "MED_DF1661783DBA5D80", "name": "PTT-20260120-WA0002.opus", "path": "media/MED_DF1661783DBA5D80_PTT-20260120-WA0002.opus", "type": ".opus", "bytes": 13946, "sha256": "0d05ab61c5fd2cd813328424f2a31104e0eb5f4429bde03c4907a5d296dd72a7", "transcript": "Beleza, tu tá em casa? Eu tô indo aí, eu tô bem aqui nessa ruazinha projetada.", "language": "pt"}], "id": "MSG_2B86EF410B2959F0", "unresolved_media": 0, "missing_files": []}, {"date": "20/01/2026", "time": "08:56", "timestamp": "2026-01-20T08:56:00", "sender": "Fernando", "text": "Tô sim", "media": [], "id": "MSG_DB203B165B71524B", "unresolved_media": 0, "missing_files": []}, {"date": "26/01/2026", "time": "18:26", "timestamp": "2026-01-26T18:26:00", "sender": "Fernando", "text": "Boa noite, Alberto. Tudo beleza? Vi que o pintor trabalhou no sábado até tarde e hoje o cara veio colocar a concertina aqui do lado. Será que amanhã sai essa cerca? E as outras coisas daqui pra ajeitar. Tem previsão?", "media": [], "id": "MSG_BC4FA0FE03F55F5D", "unresolved_media": 0, "missing_files": []}, {"date": "26/01/2026", "time": "18:26", "timestamp": "2026-01-26T18:26:00", "sender": "Alberto Casa", "text": "‎PTT-20260126-WA0009.opus (arquivo anexado)", "media": [{"id": "MED_0D745FB4E2115479", "name": "PTT-20260126-WA0009.opus", "path": "media/MED_0D745FB4E2115479_PTT-20260126-WA0009.opus", "type": ".opus", "bytes": 22862, "sha256": "3bf14e47ab5de3e17e6f9dd170fd289bfbca0e5915d23e0cbda7cef44e1c8cd1", "transcript": "Aí amanhã eu quero que tu deixe a chave aí, pra mim, leva ele aí, pra ele coisa ajeitar a cerca aí, viu? E dizendo ele que amanhã vai. Aí eu tô... mostrar pra ele.", "language": "pt"}], "id": "MSG_89B963936679529A", "unresolved_media": 0, "missing_files": []}, {"date": "26/01/2026", "time": "18:27", "timestamp": "2026-01-26T18:27:00", "sender": "Fernando", "text": "Blz. E as outras coisas que te falei? Tem previsão?", "media": [], "id": "MSG_3299339EBB555801", "unresolved_media": 0, "missing_files": []}, {"date": "26/01/2026", "time": "18:27", "timestamp": "2026-01-26T18:27:00", "sender": "Alberto Casa", "text": "‎PTT-20260126-WA0010.opus (arquivo anexado)", "media": [{"id": "MED_C3CEE0A28AC05164", "name": "PTT-20260126-WA0010.opus", "path": "media/MED_C3CEE0A28AC05164_PTT-20260126-WA0010.opus", "type": ".opus", "bytes": 19722, "sha256": "52972cad24b5273b43d1fae3bf193a6b687d5581012b88841f98d61e06d02283", "transcript": "Aí o pintor foi hoje também, viu? Aí amanhã eu já levo ele para ele vir também. Ele já faz que ele já travou, moço. Vamos quase não voltar a trabalhar.", "language": "pt"}], "id": "MSG_7CA0451CCDFE53C6", "unresolved_media": 0, "missing_files": []}, {"date": "26/01/2026", "time": "18:28", "timestamp": "2026-01-26T18:28:00", "sender": "Fernando", "text": "Beleza", "media": [], "id": "MSG_1593CFD9C56D5A1B", "unresolved_media": 0, "missing_files": []}, {"date": "26/01/2026", "time": "18:28", "timestamp": "2026-01-26T18:28:00", "sender": "Fernando", "text": "‎IMG-20260126-WA0012.jpg (arquivo anexado)", "media": [{"id": "MED_8BBB9B9B5F445903", "name": "IMG-20260126-WA0012.jpg", "path": "media/MED_8BBB9B9B5F445903_IMG-20260126-WA0012.jpg", "type": ".jpg", "bytes": 81379, "sha256": "a9438b73a75e38df8c5b939dcd5dab81e7be4a2a7e345d760191468785efe4cb", "transcript": "", "language": ""}], "id": "MSG_E9D8099C80C059D9", "unresolved_media": 0, "missing_files": []}, {"date": "26/01/2026", "time": "18:29", "timestamp": "2026-01-26T18:29:00", "sender": "Fernando", "text": "Esse do primeiro banheiro vaza pelo ladrão. E mesmo com o registro fechado ainda enche. Faz dias que não uso esse banheiro por causa desse vazamento", "media": [], "id": "MSG_460FB9B2A2E15EF1", "unresolved_media": 0, "missing_files": []}, {"date": "26/01/2026", "time": "18:30", "timestamp": "2026-01-26T18:30:00", "sender": "Fernando", "text": "‎IMG-20260126-WA0014.jpg (arquivo anexado)", "media": [{"id": "MED_391EDE32B0FB53D0", "name": "IMG-20260126-WA0014.jpg", "path": "media/MED_391EDE32B0FB53D0_IMG-20260126-WA0014.jpg", "type": ".jpg", "bytes": 55618, "sha256": "8886005dcc91e64c19a49984fccaae895e70b11f752a7cc527560c50029b7691", "transcript": "", "language": ""}], "id": "MSG_4AA13BB7ECA854F1", "unresolved_media": 0, "missing_files": []}, {"date": "26/01/2026", "time": "18:30", "timestamp": "2026-01-26T18:30:00", "sender": "Fernando", "text": "E o castelo da pia.", "media": [], "id": "MSG_C24C6B3C32DB5A2A", "unresolved_media": 0, "missing_files": []}, {"date": "27/01/2026", "time": "08:04", "timestamp": "2026-01-27T08:04:00", "sender": "Fernando", "text": "Bom dia, Alberto. Esqueci de deixar a chave. O povo chegando aí pra fazer o serviço é só me dar um toque que vou correndo pra aí.", "media": [], "id": "MSG_951833C682C556F4", "unresolved_media": 0, "missing_files": []}, {"date": "27/01/2026", "time": "08:05", "timestamp": "2026-01-27T08:05:00", "sender": "Fernando", "text": "O pintor disse que ia lá para casa segunda ou terça. Ontem ele não foi, então acho que é hoje.", "media": [], "id": "MSG_D82006233D065D08", "unresolved_media": 0, "missing_files": []}, {"date": "27/01/2026", "time": "08:07", "timestamp": "2026-01-27T08:07:00", "sender": "Fernando", "text": "E aproveitando o pintor, ele pintou o portao do lado e o meu também kkk", "media": [], "id": "MSG_B4A7363A5DF25983", "unresolved_media": 0, "missing_files": []}, {"date": "27/01/2026", "time": "08:22", "timestamp": "2026-01-27T08:22:00", "sender": "Alberto Casa", "text": "‎PTT-20260127-WA0001.opus (arquivo anexado)", "media": [{"id": "MED_13BE77CB2F6D56ED", "name": "PTT-20260127-WA0001.opus", "path": "media/MED_13BE77CB2F6D56ED_PTT-20260127-WA0001.opus", "type": ".opus", "bytes": 36519, "sha256": "5d6d0a09c974b74c79e99e62256a817e1a2ebd02278665cb17db5fb38a7ec38d", "transcript": "Eu tô aqui, o Pedro até disse que perguntou, você perguntou por mim aqui. Aí eu tinha passado aqui na outra obra. Aí eu cheguei aqui, era oito horas. Eu pensei que tinham deixado. Mas ele vai estar aqui amanhã também, então amanhã eu tô pronto, deixa eu deixar aqui.", "language": "pt"}], "id": "MSG_59E574B793D5556B", "unresolved_media": 0, "missing_files": []}, {"date": "27/01/2026", "time": "08:23", "timestamp": "2026-01-27T08:23:00", "sender": "Fernando", "text": "Eles estão aí?", "media": [], "id": "MSG_35F493B9CDE85D00", "unresolved_media": 0, "missing_files": []}, {"date": "27/01/2026", "time": "08:23", "timestamp": "2026-01-27T08:23:00", "sender": "Fernando", "text": "Se estiverem eu vou agora", "media": [], "id": "MSG_CD8B49B1A4025B9F", "unresolved_media": 0, "missing_files": []}, {"date": "11/02/2026", "time": "08:21", "timestamp": "2026-02-11T08:21:00", "sender": "Alberto Casa", "text": "", "media": [], "id": "MSG_9AB9BA84819C5150", "unresolved_media": 0, "missing_files": []}, {"date": "11/02/2026", "time": "08:22", "timestamp": "2026-02-11T08:22:00", "sender": "Alberto Casa", "text": "‎PTT-20260213-WA0001.opus (arquivo anexado)", "media": [{"id": "MED_913C90A5745A5BFC", "name": "PTT-20260213-WA0001.opus", "path": "media/MED_913C90A5745A5BFC_PTT-20260213-WA0001.opus", "type": ".opus", "bytes": 75596, "sha256": "e6d9db572a01ed33bb9fadefad0eb473e40f4b4fb454b53ceddd746794fd0484", "transcript": "Bom dia, meu amigo, tudo bem? Na época eu queria ver bem a questão do teu coisa aí, da tua casa. Eu queria levar o pintor aí, eu tinha te mandado até uma mensagem aqui, mas eu pensei que tinha ido, a mensagem não foi, ó. Era pra ter deixado a chave. Aí como esse zinco da casa, ele soltou, aí eu vou só descer uma escadazinha, mas não vou descer no teu que tá não, só botar a escada bem no muro, pra não me parafusar do lado daí, entendeu? Em cima do teto mesmo, deixar a escada grande, aí eu parafuso, viu? Aí quando tu pudesse amanhã tu deixasse a chave também, pro rapaz dar cerca aí, ligar aí central, viu?", "language": "pt"}], "id": "MSG_E852502C7A535AA7", "unresolved_media": 0, "missing_files": []}, {"date": "13/02/2026", "time": "12:03", "timestamp": "2026-02-13T12:03:00", "sender": "Alberto Casa", "text": "Boa tarde", "media": [], "id": "MSG_CB4E958C8E525AEE", "unresolved_media": 0, "missing_files": []}, {"date": "13/02/2026", "time": "13:38", "timestamp": "2026-02-13T13:38:00", "sender": "Fernando", "text": "Boa tarde", "media": [], "id": "MSG_1832AEDDC6595F00", "unresolved_media": 0, "missing_files": []}, {"date": "13/02/2026", "time": "13:40", "timestamp": "2026-02-13T13:40:00", "sender": "Alberto Casa", "text": "‎PTT-20260213-WA0002.opus (arquivo anexado)", "media": [{"id": "MED_31043B8DCAF45A00", "name": "PTT-20260213-WA0002.opus", "path": "media/MED_31043B8DCAF45A00_PTT-20260213-WA , "missing_files": []}, {"date": "05/03/2026", "time": "09:34", "timestamp": "2026-03-05T09:34:00", "sender": "Alberto Casa", "text": "‎PTT-20260305-WA0117.opus (arquivo anexado)", "media": [{"id": "MED_154369E24C455057", "name": "PTT-20260305-WA0117.opus", "path": "media/MED_154369E24C455057_PTT-20260305-WA0117.opus", "type": ".opus", "bytes": 14392, "sha256": "251790c89b2e6a216325474cc91ffef6b4b1f8841bbeccc2e1a8a7c5f9121467", "transcript": "Quando tu fala aquele espelhozinho, né? O espelhozinho da fechadura, qual é que tu tá falando?", "language": "pt"}], "id": "MSG_CBCC98009B1A5212", "unresolved_media": 0, "missing_files": []}, {"date": "05/03/2026", "time": "09:34", "timestamp": "2026-03-05T09:34:00", "sender": "Fernando", "text": "Esse mesmo", "media": [], "id": "MSG_3CAC9FF601005082", "unresolved_media": 0, "missing_files": []}, {"date": "06/03/2026", "time": "19:52", "timestamp": "2026-03-06T19:52:00", "sender": "Fernando", "text": "Boa noite. Não precisou quebrar na parte de cima da parede? Ontem infiltrou bastante, ainda tinham as marcas visivelmente úmidas quando sai hoje para o trabalho.\\nVi que as cerâmicas furadas e trincadas não foram trocadas, ainda falta  fechar a cerca, a central de choque ta desligada, você não deixou as \"contra-testa\" das portas...\\n\\nVocês vêm amanhã?", "media": [], "id": "MSG_DDB13710B5DE59E0", "unresolved_media": 0, "missing_files": []}, {"date": "06/03/2026", "time": "20:10", "timestamp": "2026-03-06T20:10:00", "sender": "Alberto Casa", "text": "‎PTT-20260306-WA0031.opus (arquivo anexado)", "media": [{"id": "MED_C849AD477925529A", "name": "PTT-20260306-WA0031.opus", "path": "media/MED_C849AD477925529A_PTT-20260306-WA0031.opus", "type": ".opus", "bytes": 69150, "sha256": "7a2cd245a302f198ee83a37dcb0a5f186e098505b53572291e087ee9614e0b9c", "transcript": "Pois é, o rapaz da cerca ficou de ontem à tarde, liguei pra ele hoje, aí disse que não tava sentindo bem mais dia, né? Aí o rapaz, o vizinho do lado aí, fechou o portão, os cabas terminados, né, fecharam o portão, e nós não sabíamos onde encontrar o caba. Aí o vizinho ficou de ver aí, quando ele foi botar o caba pros cachorros pra falar com ele, pra ele deixar achar, pra abrir o portão aí, pra não se quebrar. E aí", "language": "pt"}], "id": "MSG_8501B60B08235BEE", "unresolved_media": 0, "missing_files": []}, {"date": "06/03/2026", "time": "20:12", "timestamp": "2026-03-06T20:12:00", "sender": "Fernando", "text": "Então pelo lado de dentro nao vai quebrar mais nada?", "media": [], "id": "MSG_1772B118F98B5C0B", "unresolved_media": 0, "missing_files": []}, {"date": "06/03/2026", "time": "20:13", "timestamp": "2026-03-06T20:13:00", "sender": "Fernando", "text": "Mesmo naqueles lugares que tavam molhado, é isso?\\n\\nE amanha vao vir e se sim, vao ficat ate que horas?", "media": [], "id": "MSG_6D4BE69F0B695A49", "unresolved_media": 0, "missing_files": []}, {"date": "06/03/2026", "time": "20:13", "timestamp": "2026-03-06T20:13:00", "sender": "Alberto Casa", "text": "‎PTT-20260306-WA0032.opus (arquivo anexado)", "media": [{"id": "MED_0F2700C39AB65CBC", "name": "PTT-20260306-WA0032.opus", "path": "media/MED_0F2700C39AB65CBC_PTT-20260306-WA0032.opus", "type": ".opus", "bytes": 72008, "sha256": "4bdc4bbf8ecaf5e8a74d827decab94ddc6cdb08808f204455899b50b5a65832e", "transcript": "Aí eu te aviso, é porque eu tô aguardando só ver a chave aí do vizinho do lado, porque a gente tem que ir, essa água tá entrando é por causa da parede do lado aí que tá, achou o reboco rachado, ela tá penetrando, entendeu? Pelo tijolo, mas é só quebrar o reboco, aí é onde tá do lado de dentro aí, o menino vai pintar, quebrar e tirar, passar o celular 30 e pintar, entendeu? Ela atravessa mais rápido. Eu tô só vendo aqui, você consegue falar com o rapaz do lado aí, o vizinho, todo esse terreno.", "language": "pt"}], "id": "MSG_15E9501027CC5090", "unresolved_media": 0, "missing_files": []}, {"date": "06/03/2026", "time": "20:14", "timestamp": "2026-03-06T20:14:00", "sender": "Fernando", "text": "Blz", "media": [], "id": "MSG_FA83388B700951A1", "unresolved_media": 0, "missing_files": []}, {"date": "07/03/2026", "time": "07:43", "timestamp": "2026-03-07T07:43:00", "sender": "Fernando", "text": "Bom dia, Alberto.\\nPreciso saber se vai vir alguém pra ca hoje. Pois se vierem vou ter que ajustar minha rota pra pegar a chave com o vigia.", "media": [], "id": "MSG_06D68ABA61D5561E", "unresolved_media": 0, "missing_files": []}, {"date": "07/03/2026", "time": "07:46", "timestamp": "2026-03-07T07:46:00", "sender": "Alberto Casa", "text": "‎PTT-20260307-WA0000.opus (arquivo anexado)", "media": [{"id": "MED_24F31CD82DD353A2", "name": "PTT-20260307-WA0000.opus", "path": "media/MED_24F31CD82DD353A2_PTT-20260307-WA0000.opus", "type": ".opus", "bytes": 67187, "sha256": "812863b9c08a164fbdfd3804be8a812f5836f1c9289212947979280b54214d9d", "transcript": "Faz assim, que nós não conseguimos falar com o rapaz da casa. O rapaz que estava trabalhando disse que ia lá pela manhã. Então nós deixamos para segunda-feira para não bagunçar a tua rota, viu? Aí segunda-feira a gente já vai, tá bom? Porque aí eu ia mandar o pintor para pintar aí dentro, né? Mas só que como tem que fazer essa coisa bem do outro terreno, porque se chover e vai molhar a tinta de novo, vai ficar a mesma coisa. Então a gente vai deixar para segunda-feira, viu?", "language": "pt"}], "id": "MSG_FCE6D2BD89B2563D", "unresolved_media": 0, "missing_files": []}, {"date": "07/03/2026", "time": "07:47", "timestamp": "2026-03-07T07:47:00", "sender": "Fernando", "text": "Ok", "media": [], "id": "MSG_FCA42E6981BE57C9", "unresolved_media": 0, "missing_files": []}, {"date": "09/03/2026", "time": "07:44", "timestamp": "2026-03-09T07:44:00", "sender": "Fernando", "text": "‎PTT-20260309-WA0000.opus (arquivo anexado)", "media": [{"id": "MED_9ED43ABE07FC5C3F", "name": "PTT-20260309-WA0000.opus", "path": "media/MED_9ED43ABE07FC5C3F_PTT-20260309-WA0000.opus", "type": ".opus", "bytes": 12720, "sha256": "4bb01f320af6ac938be6fcafc0f3ea3140f8c15a095d76d302540c08c0a98adf", "transcript": "Bom dia, eu tô batendo aqui na porta e o vídeo não tá abrindo. Tem alguma notícia?", "language": "pt"}], "id": "MSG_F117055457475F47", "unresolved_media": 0, "missing_files": []}, {"date": "09/03/2026", "time": "07:45", "timestamp": "2026-03-09T07:45:00", "sender": "Fernando", "text": "", "media": [], "id": "MSG_CDFB4C2987DD5AAE", "unresolved_media": 0, "missing_files": []}, {"date": "09/03/2026", "time": "07:51", "timestamp": "2026-03-09T07:51:00", "sender": "Alberto Casa", "text": "‎PTT-20260309-WA0001.opus (arquivo anexado)", "media": [{"id": "MED_0AB76E2A37F35F22", "name": "PTT-20260309-WA0001.opus", "path": "media/MED_0AB76E2A37F35F22_PTT-20260309-WA0001.opus", "type": ".opus", "bytes": 35331, "sha256": "15527161c5ec4ac23001fa07ebd4ae72202bfc66cf11c803dba78a261d801fd4", "transcript": "Opa, eu tinha até mandado o pintor pra ir, ó O vigia era pra tá aí Será que ele saiu pra tomar café? Que ele toma café que ele disse não tá fazendo mais Aí tá saindo cedinho pra tomar mais volta cedo, ó Ô vigia Mas eu tô descendo pra ir Vem agora aqui, tá andando de moto", "language": "pt"}], "id": "MSG_149F018F94AB5519", "unresolved_media": 0, "missing_files": []}, {"date": "09/03/2026", "time": "07:59", "timestamp": "2026-03-09T07:59:00", "sender": "Fernando", "text": "Qual a previsao plde chegarem aqui?", "media": [], "id": "MSG_86408A5C55725CEA", "unresolved_media": 0, "missing_files": []}, {"date": "09/03/2026", "time": "08:03", "timestamp": "2026-03-09T08:03:00", "sender": "Fernando", "text": "‎PTT-20260309-WA0003.opus (arquivo anexado)", "media": [{"id": "MED_2046BCDDC7295C30", "name": "PTT-20260309-WA0003.opus", "path": "media/MED_2046BCDDC7295C30_PTT-20260309-WA0003.opus", "type": ".opus", "bytes": 18481, "sha256": "796e19812b30ceb071d81d7a50ce3940b044ebb1f4cae382d4d42c9560c511e0", "transcript": "Enquanto o tempo chegou alguém aqui, peixe, porque era pra eu estar no trabalho 8 horas. Diz que o Vitor j  mureta, porque aí não adianta o pintor pintar aí, porque senão vai infiltrar a água todinha pra dentro e vai ficar a mesma coisa. É, tem que tirar a massa todinha de novo. Eu vou deixar logo eles finalizarem fora, aí nós vamos pra dentro.", "language": "pt"}], "id": "MSG_DDF31C5EA9B45A65", "unresolved_media": 0, "missing_files": []}, {"date": "09/03/2026", "time": "16:58", "timestamp": "2026-03-09T16:58:00", "sender": "Alberto Casa", "text": "‎PTT-20260309-WA0024.opus (arquivo anexado)", "media": [{"id": "MED_1D26F25D11C75EC3", "name": "PTT-20260309-WA0024.opus", "path": "media/MED_1D26F25D11C75EC3_PTT-20260309-WA0024.opus", "type": ".opus", "bytes": 27941, "sha256": "1db8d58c5e5ece08776db1efdcdcae2c7600bc8030287846b113cb736ec26c96", "transcript": "Aí eu falei com o rapaz da cerca aqui, aí ele foi duas vezes aí, não me avisou nada. Aí disse que bateu, bateu, não tinha ninguém. Como dá pra que ele vai sem avisar? Ele nem me ligou e nem nada.", "language": "pt"}], "id": "MSG_B1BC5ACA9F935881", "unresolved_media": 0, "missing_files": []}, {"date": "09/03/2026", "time": "16:59", "timestamp": "2026-03-09T16:59:00", "sender": "Fernando", "text": "Ok", "media": [], "id": "MSG_FFCC2810525C5D84", "unresolved_media": 0, "missing_files": []}, {"date": "09/03/2026", "time": "18:26", "timestamp": "2026-03-09T18:26:00", "sender": "Fernando", "text": "Hoje nao foi feito nada dentro da casa, correto?", "media": [], "id": "MSG_4058CF336B685E17", "unresolved_media": 0, "missing_files": []}, {"date": "11/03/2026", "time": "06:58", "timestamp": "2026-03-11T06:58:00", "sender": "Alberto Casa", "text": "‎PTT-20260311-WA0000.opus (arquivo anexado)", "media": [{"id": "MED_9A66E8F1D8875B5A", "name": "PTT-20260311-WA0000.opus", "path": "media/MED_9A66E8F1D8875B5A_PTT-20260311-WA0000.opus", "type": ".opus", "bytes": 50253, "sha256": "d4aa2d35d1f6ac04aab908d28db4e4a283eeba6be3e0fec299f71ac274d63007", "transcript": "Bom dia, meu amigo. Tudo bem? Fernanda, é porque os meninos vão pra ajeitar dentro hoje, que eles terminaram lá fora. Aí eles vão mexer do lado de dentro. Os pedidos vão te esperar abrindo a porta. Zé Nilton, moreno. Um senhor já moreno, viu? Ele e o Servente. Aí eles vão... Já quebraram fora. Aí eles querem vir dentro aí pra tirar aquele vazamento lá e ajeitar a parte de dentro.", "language": "pt"}], "id": "MSG_7A6AFB561E285895", "unresolved_media": 0, "missing_files": []}, {"date": "11/03/2026", "time": "07:00", "timestamp": "2026-03-11T07:00:00", "sender": "Fernando", "text": "Bom dia. Ok", "media": [], "id": "MSG_14830270EC455CBA", "unresolved_media": 0, "missing_files": []}, {"date": "11/03/2026", "time": "17:18", "timestamp": "2026-03-11T17:18:00", "sender": "Alberto Casa", "text": "‎PTT-20260311-WA0018.opus (arquivo anexado)", "media": [{"id": "MED_36E80EF7E49757D3", "name": "PTT-20260311-WA0018.opus", "path": "media/MED_36E80EF7E49757D3_PTT-20260311-WA0018.opus", "type": ".opus", "bytes": 56196, "sha256": "89fa8b8e5bdf4438313b3143b27709008d3058df8f32c165779dbc4913809e21", "transcript": "Boa tarde meu amigo, tudo bem? Me diga uma coisa, você chega que horas? É porque o pedreiro já foi? Eu estou com a chave aqui Ele vai vir amanhã de novo Ele tirou um bocado de cerâmica Não pode banhar lá na suíte não Ele trocou aquela do ralo também Não está bem seca ainda Que hora você vem para me entregar a chave?", "language": "pt"}], "id": "MSG_92EAD76643D85DE8", "unresolved_media": 0, "missing_files": []}, {"date": "11/03/2026", "time": "17:18", "timestamp": "2026-03-11T17:18:00", "sender": "Alberto Casa", "text": "‎PTT-20260311-WA0019.opus (arquivo anexado)", "media": [{"id": "MED_3A332C40A85B5B21", "name": "PTT-20260311-WA0019.opus", "path": "media/MED_3A332C40A85B5B21_PTT-20260311-WA0019.opus", "type": ".opus", "bytes": 11985, "sha256": "4be19f2642e380d0f1be521ace63c338b2569f014f335cfce8051b597f1b77e1", "transcript": "Você tem alguma chave aí? Porque se tiver, eu jogo essa daqui por cima do portão.", "language": "pt"}], "id": "MSG_338BBE508C1F5
