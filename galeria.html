<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Offline</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        h1 { text-align: center; margin-bottom: 30px; font-size: 2rem; }
        h2 { margin: 30px 0 15px 0; font-size: 1.4rem; border-bottom: 2px solid #333; padding-bottom: 5px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            aspect-ratio: 1 / 1;
        }
        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .card img, .card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .icon-play {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 48px; height: 48px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .icon-play::after {
            content: ""; display: block;
            width: 0; height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 16px solid #fff;
            margin-left: 4px;
        }
        .modal {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            max-width: 85%; max-height: 85vh;
            border-radius: 4px; outline: none;
        }
        .close {
            position: absolute; top: 20px; right: 30px;
            color: #fff; font-size: 40px; font-weight: bold;
            cursor: pointer; z-index: 1001;
        }
        .nav-btn {
            position: absolute; top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: #fff; border: none; font-size: 30px;
            padding: 15px 20px; cursor: pointer;
            border-radius: 4px; z-index: 1001;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.3); }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }
    </style>
</head>
